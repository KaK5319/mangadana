plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.mangadana"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // 新規アプリ「漫画棚」として分離するID（旧SideBooksとは別アプリになる）
        applicationId = "com.example.mangadana"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // RAR(RAR5含む)の展開をAndroid側で行うための純Javaライブラリ Junrar。
    // 従来の rar プラグイン(同梱 libarchive 3.7.2)は RAR5 でアプリごと落ちたため、
    // 展開はこちらに差し替える。失敗しても Java の例外として受け取れる。
    // バージョンは Maven Central の最新安定版 8.1.2(2026-10-10公開)
    implementation "com.github.junrar:junrar:8.1.2"
}
